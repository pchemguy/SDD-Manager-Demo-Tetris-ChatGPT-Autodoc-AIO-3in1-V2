<!doctype html><html><head><meta charset="utf-8"><title>Isolated extension API harness</title></head><body><script>
// Test-only transport/storage APIs. Actual background and panel bundles remain unmodified.
const family=new URL(location).searchParams.get('family'),event=()=>{const listeners=[];return{addListener:fn=>listeners.push(fn),emit:value=>listeners.forEach(fn=>fn(value))};};
let connectListener,number=0;window.failure=false;window.localWrites=0;window.sessionWrites=0;
const api={runtime:{id:'isolated-test',onConnect:{addListener:fn=>connectListener=fn},lastError:undefined},action:{onClicked:{addListener(){}}}};
function area(which){return{get(key,callback){const value=JSON.parse((which==='local'?localStorage:sessionStorage).getItem(key)||'null');const result=value===null?{}:{[key]:value};if(callback)queueMicrotask(()=>callback(result));else return Promise.resolve(result);},set(values,callback){if(failure){if(!callback)return Promise.reject(Error('Injected storage failure'));api.runtime.lastError={message:'Injected storage failure'};callback();api.runtime.lastError=undefined;return;}for(const [key,value]of Object.entries(values))(which==='local'?localStorage:sessionStorage).setItem(key,JSON.stringify(value));window[which+'Writes']++;if(callback)queueMicrotask(callback);else return Promise.resolve();},remove(key,callback){(which==='local'?localStorage:sessionStorage).removeItem(key);if(callback)queueMicrotask(callback);else return Promise.resolve();}};}
api.storage={local:area('local'),session:area('session')};window.chrome=api;window.browser=api;
window.openPanel=(search='')=>{const frame=document.createElement('iframe');frame.name='panel'+(++number);frame.src=family+'/panel.html'+search;frame.style='width:360px;height:1000px';document.body.append(frame);return frame.name;};
window.connectPanel=(frameWindow)=>{const front={name:'tetris-panel',onMessage:event(),onDisconnect:event()},back={name:'tetris-panel',sender:{id:api.runtime.id},onMessage:event(),onDisconnect:event()};let closed=false;front.postMessage=m=>{if(closed)throw Error('Disconnected');if(m.type==='seed'&&window.delaySeed){window.delayedSeeds=(window.delayedSeeds||0)+1;setTimeout(()=>back.onMessage.emit(structuredClone(m)),window.delaySeed);}else queueMicrotask(()=>back.onMessage.emit(structuredClone(m)));};back.postMessage=m=>{if(closed)throw Error('Disconnected');queueMicrotask(()=>front.onMessage.emit(structuredClone(m)));};frameWindow.addEventListener('pagehide',()=>{closed=true;back.onDisconnect.emit();front.onDisconnect.emit();},{once:true});connectListener(back);return front;};
const script=document.createElement('script');script.src=family+'/background.js';script.onload=()=>window.ready=true;document.head.append(script);
</script></body></html>
