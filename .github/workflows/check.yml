name: Application checks
on:
  push:
    branches: [main, 'phase/**']
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium --only-shell firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-binaries
      - run: npm run typecheck && npm run build:test && npm run build
      - run: python -m pytest
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-binaries
      - run: python -m pytest tests/browser tests/platforms/test_extension_panels.py
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-binaries
          TETRIS_BROWSER: firefox
      - run: python scripts/package.py && python scripts/verify_packages.py artifacts
